<script>
const D = JSON.parse(document.getElementById('payload').textContent);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const NS = 'f:' + location.pathname + ':';

async function unlock(pw){
  const kb = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw),
    'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64(D.s), iterations:D.i, hash:'SHA-256'},
    kb, {name:'AES-GCM', length:256}, false, ['decrypt']);
  return new TextDecoder().decode(
    await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(D.n)}, key, b64(D.c)));
}

function wireFields(){
  const els = document.querySelectorAll('[data-k]');
  if (!els.length) return;
  els.forEach(el => {
    el.contentEditable = 'true';
    el.spellcheck = false;
    let saved = null;
    try { saved = localStorage.getItem(NS + el.dataset.k); } catch(_){}
    if (saved !== null && saved !== '') el.textContent = saved;
    el.addEventListener('input', () => {
      try { localStorage.setItem(NS + el.dataset.k, el.textContent); } catch(_){}
    });
    el.addEventListener('keydown', ev => { if (ev.key === 'Enter') ev.preventDefault(); });
  });
  document.getElementById('bar').style.display = 'flex';
  document.getElementById('prn').onclick = () => window.print();
  document.getElementById('clr').onclick = () => {
    if (!confirm('Стереть всё, что вписано на этой странице?')) return;
    els.forEach(el => {
      el.textContent = el.dataset.ph || '';
      try { localStorage.removeItem(NS + el.dataset.k); } catch(_){}
    });
  };
}

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('b'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = ''; btn.textContent = 'Расшифровка...';
  try {
    const html = await unlock(document.getElementById('p').value);
    document.getElementById('gate').remove();
    const c = document.getElementById('content');
    c.innerHTML = html;
    c.style.display = 'block';
    wireFields();
  } catch (_) {
    err.textContent = 'Неверный пароль';
    btn.disabled = false; btn.textContent = 'Открыть';
    document.getElementById('p').select();
  }
});
</script>
