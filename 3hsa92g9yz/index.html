<script>
const D = JSON.parse(document.getElementById('payload').textContent);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pw){
  const kb = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw),
    'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64(D.s), iterations:D.i, hash:'SHA-256'},
    kb, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(D.n)}, key, b64(D.c));
  return new TextDecoder().decode(plain);
}

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('b'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = ''; btn.textContent = 'Расшифровка...';
  try {
    const html = await unlock(document.getElementById('p').value);
    document.getElementById('gate').remove();
    const c = document.getElementById('content');
    c.innerHTML = html;
    c.style.display = 'block';
    document.title = c.querySelector('h1') ? c.querySelector('h1').textContent : '\u2022';
  } catch (_) {
    err.textContent = 'Неверный пароль';
    btn.disabled = false; btn.textContent = 'Открыть';
    document.getElementById('p').select();
  }
});
</script>
